<h1>Alta Peliculas</h1>
<form [formGroup]="movieForm" (submit)="handleSubmit()">
            <div class="mb-3">
              <label for="name" class="form-label">Nombre</label>
              <input type="text" id="name" class="form-control" formControlName="name" />
              @if(nameForm.invalid && nameForm.touched) {
                <div class="text-danger">El nombre es requerido</div>
              }
            </div>
            <div class="mb-3">
              <label for="duration" class="form-label">Duración</label>
              <input type="text" id="duration" class="form-control" formControlName="duration" />
              @if(durationForm.hasError('required') && durationForm.touched) {
                <div class="text-danger">La duración es requerida</div>
              }
              @if(durationForm.hasError('max') && durationForm.touched) {
                <div class="text-danger">La duración no puede exceder 300</div>
              }
            </div>
            <div class="mb-3">
              <label for="director" class="form-label">Director</label>
              <input type="text" id="director" class="form-control" formControlName="director" />
            </div>
            <button type="text" class="btn btn-primary" [disabled]="!movieForm.valid">Crear Película</button>
          </form>
