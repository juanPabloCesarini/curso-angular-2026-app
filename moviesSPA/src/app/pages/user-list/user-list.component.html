<app-header></app-header>   
<h1>Users</h1>

<div class="container">


    @for(user of userService.users; track $index){
        <div class="card shadow-sm mb-3" style="width: 18rem">
      <div class="card-body">
        <h5 class="card-title">{{ user.name }}</h5>
        <p class="card-text">Email: {{ user.email }}</p>
        <p class="card-text">Address: {{ user.address.street }}, {{ user.address.city }}</p>
      </div>
      <div class="card-footer">
        <a [routerLink]="['/user-detail', user.id]" class="btn btn-primary">View Details</a>
        <button type="button" class="btn btn-danger" (click)="deleteUser(user.id)">Delete</button>
      </div>
    </div>

    }
</div>
