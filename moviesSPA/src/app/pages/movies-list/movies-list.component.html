
<app-header></app-header>
<div class="container">
  <h3>Movies List</h3>
</div>

<div class="container">
  
    @for (movie of movieService.movies; track $index) {
      
        <div class="card shadow-sm mb-3" style="width: 18rem;">
          <div class="card-body">
            <h5 class="card-title">{{ movie.name }}</h5>
            <p class="card-text">Duration: {{ movie.duration }} minutes</p>
            <p class="card-text">Director: {{ movie.director }}</p>
          </div>
        </div>
      
    }
  
</div>
